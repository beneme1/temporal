name: Update Temporal blog RSS feed

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (off the hour to avoid peak load)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the updated feed

concurrency:
  group: blog-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Temporal blog feed"
            git push
          fi
